name: Release

# Publishes a GitHub Release (zip + tar.gz + SHA256SUMS) for a plugin version.
#
# - Push to main: if the version in smoxy.php has no vX.Y.Z tag yet, the tag
#   and the release are created on that commit, so merging a release PR is
#   all it takes to publish. Every other push to main is a no-op.
# - Push of a v* tag, or workflow_dispatch: (re)builds the release for it.
#
# The release notes are the version's CHANGELOG.md section, followed by
# GitHub's generated list of merged PRs. Sites running the plugin show these
# notes in their update screen (plugin-update-checker reads the release).

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for, e.g. v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag / version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            HEADER=$(awk '/^[[:space:]]*\*[[:space:]]*Version:/ { print $3; exit }' smoxy.php)
            TAG="v${HEADER}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "${TAG} is already released; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$TAG' does not look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build & publish release
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify version in plugin matches tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          HEADER=$(awk '/^[[:space:]]*\*[[:space:]]*Version:/ { print $3; exit }' smoxy.php)
          CONST=$(awk -F"'" "/define\\(.*SMOXY_VERSION/ { print \$4; exit }" smoxy.php)
          STABLE=$(awk '/^Stable tag:/ { print $3; exit }' readme.txt)
          fail=0
          for pair in "header:$HEADER" "constant:$CONST" "stable-tag:$STABLE"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$VERSION" ]; then
              echo "mismatch: $name=$val, tag=$VERSION"
              fail=1
            fi
          done
          [ "$fail" = "0" ]

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "error: CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          cat "${RUNNER_TEMP}/release-notes.md"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install production composer deps
        run: composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist

      - name: Build distribution archives
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -e
          mkdir -p build/smoxy dist
          rsync -a --exclude-from=.distignore ./ build/smoxy/
          ( cd build && zip -qr "../dist/smoxy-${VERSION}.zip" smoxy )
          tar -C build -czf "dist/smoxy-${VERSION}.tar.gz" smoxy
          ( cd dist && sha256sum "smoxy-${VERSION}.zip" "smoxy-${VERSION}.tar.gz" > "smoxy-${VERSION}-SHA256SUMS.txt" )
          ls -la dist/

      # Creates the tag on this commit when it does not exist yet (push to
      # main); for an existing tag the release is created or updated in place.
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            dist/smoxy-${{ needs.resolve.outputs.version }}.zip
            dist/smoxy-${{ needs.resolve.outputs.version }}.tar.gz
            dist/smoxy-${{ needs.resolve.outputs.version }}-SHA256SUMS.txt
